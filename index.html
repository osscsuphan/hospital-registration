<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ลงทะเบียนเข้าร่วม OpenChat</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, "Noto Sans Thai", sans-serif;
      background: #f5f7f9;
      color: #222;
    }

    .container {
      max-width: 520px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.08);
    }

    h1 {
      font-size: 22px;
      margin: 0 0 8px;
      text-align: center;
    }

    .subtitle {
      text-align: center;
      color: #666;
      font-size: 14px;
      margin-bottom: 20px;
      line-height: 1.6;
    }

    #lineStatus {
      padding: 12px;
      border-radius: 10px;
      background: #f0f2f4;
      text-align: center;
      font-size: 14px;
      margin-bottom: 20px;
      line-height: 1.6;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
    }

    .required {
      color: #d93025;
    }

    input {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #d5d9dd;
      border-radius: 10px;
      font-size: 16px;
      background: #fff;
    }

    input:focus {
      outline: none;
      border-color: #06c755;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 14px;
      font-size: 17px;
      font-weight: bold;
      background: #06c755;
      color: white;
      cursor: pointer;
      margin-top: 8px;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      display: none;
      margin-top: 20px;
      padding: 14px;
      border-radius: 10px;
      line-height: 1.6;
    }

    .success {
      display: block !important;
      background: #e8f7ed;
      color: #166534;
    }

    .error {
      display: block !important;
      background: #fdecec;
      color: #b42318;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>ลงทะเบียนเข้าร่วม OpenChat</h1>

  <div class="subtitle">
    สำหรับผู้ประกอบการสถานพยาบาล<br>
    จังหวัดสุพรรณบุรี
  </div>

  <div id="lineStatus">
    กำลังเชื่อมต่อบัญชี LINE...
  </div>

  <form id="registerForm">

    <div class="form-group">
      <label>
        ชื่อ-นามสกุล
        <span class="required">*</span>
      </label>

      <input
        type="text"
        id="fullName"
        placeholder="กรอกชื่อ-นามสกุล"
        required>
    </div>

    <div class="form-group">
      <label>
        ชื่อสถานพยาบาล
        <span class="required">*</span>
      </label>

      <input
        type="text"
        id="facilityName"
        placeholder="กรอกชื่อสถานพยาบาล"
        required>
    </div>

    <div class="form-group">
      <label>
        ตำแหน่ง / หน้าที่
        <span class="required">*</span>
      </label>

      <input
        type="text"
        id="position"
        placeholder="เช่น ผู้รับอนุญาต ผู้ดำเนินการ เจ้าหน้าที่"
        required>
    </div>

    <button
      type="submit"
      id="submitButton"
      disabled>
      กำลังเชื่อมต่อ LINE...
    </button>

  </form>

  <div id="message"></div>

</div>


<script>

  const LIFF_ID = '2011774617-WRY44KK3';

  /*
   * นำ Web App URL ของ Apps Script
   * ที่ลงท้ายด้วย /exec มาใส่ตรงนี้
   */
  const API_URL = 'https://script.google.com/macros/s/AKfycbzsEBT5BGtx1do4JVTkRo0cxdVuFTr-nvxV9-Az45kz5oe8RQBjmr3fVMzfk34znejg/exec';


  let lineUserId = '';
  let lineDisplayName = '';


  async function initializeLiff() {

    const status =
      document.getElementById('lineStatus');

    const button =
      document.getElementById('submitButton');

    try {

      await liff.init({
        liffId: LIFF_ID
      });


      if (!liff.isLoggedIn()) {

        liff.login();
        return;
      }


      const profile =
        await liff.getProfile();


      lineUserId =
        profile.userId;

      lineDisplayName =
        profile.displayName;


      status.textContent =
        'เชื่อมต่อ LINE แล้ว : ' +
        lineDisplayName;

      status.style.background =
        '#e8f7ed';

      status.style.color =
        '#166534';


      button.disabled = false;
      button.textContent = 'ลงทะเบียน';


    } catch (error) {

      console.error(error);

      status.textContent =
        'ไม่สามารถเชื่อมต่อบัญชี LINE ได้';

      status.style.background =
        '#fdecec';

      status.style.color =
        '#b42318';

      button.disabled = true;

      button.textContent =
        'ไม่สามารถลงทะเบียนได้';
    }
  }



  document
    .getElementById('registerForm')
    .addEventListener(
      'submit',
      async function(event) {

        event.preventDefault();


        const button =
          document.getElementById(
            'submitButton'
          );

        const message =
          document.getElementById(
            'message'
          );


        if (!lineUserId) {

          message.textContent =
            'ไม่พบข้อมูลบัญชี LINE กรุณาเปิดแบบฟอร์มผ่าน LINE';

          message.className =
            'error';

          return;
        }


        const fullName =
          document
            .getElementById('fullName')
            .value
            .trim();

        const facilityName =
          document
            .getElementById('facilityName')
            .value
            .trim();

        const position =
          document
            .getElementById('position')
            .value
            .trim();


        if (
          !fullName ||
          !facilityName ||
          !position
        ) {

          message.textContent =
            'กรุณากรอกข้อมูลให้ครบทุกช่อง';

          message.className =
            'error';

          return;
        }


        button.disabled = true;
        button.textContent =
          'กำลังบันทึก...';

        message.style.display =
          'none';


        try {

          const formData =
            new URLSearchParams();

          formData.append(
            'lineUserId',
            lineUserId
          );

          formData.append(
            'lineDisplayName',
            lineDisplayName
          );

          formData.append(
            'fullName',
            fullName
          );

          formData.append(
            'facilityName',
            facilityName
          );

          formData.append(
            'position',
            position
          );


          /*
           * ส่งข้อมูลไป Google Apps Script
           *
           * no-cors ใช้เพื่อหลีกเลี่ยง
           * ปัญหา CORS ระหว่าง GitHub Pages
           * กับ Apps Script
           */
          await fetch(
            API_URL,
            {
              method: 'POST',

              mode: 'no-cors',

              headers: {
                'Content-Type':
                  'application/x-www-form-urlencoded'
              },

              body:
                formData.toString()
            }
          );


          message.textContent =
            'ส่งข้อมูลลงทะเบียนเรียบร้อยแล้ว กรุณารอเจ้าหน้าที่ตรวจสอบ';

          message.className =
            'success';


          document
            .getElementById(
              'registerForm'
            )
            .reset();


          button.disabled = true;

          button.textContent =
            'ลงทะเบียนแล้ว';


        } catch (error) {

          console.error(error);


          message.textContent =
            'ไม่สามารถส่งข้อมูลได้ กรุณาลองใหม่อีกครั้ง';

          message.className =
            'error';


          button.disabled = false;

          button.textContent =
            'ลงทะเบียน';
        }
      }
    );


  initializeLiff();

</script>

</body>
</html>
