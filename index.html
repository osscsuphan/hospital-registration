<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>ลงทะเบียนเข้าร่วม OpenChat</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, "Noto Sans Thai", sans-serif;
      background: #f5f7f9;
      color: #222;
    }

    .container {
      max-width: 520px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.08);
    }

    h1 {
      font-size: 22px;
      margin: 0 0 8px;
      text-align: center;
    }

    .subtitle {
      text-align: center;
      color: #666;
      font-size: 14px;
      margin-bottom: 20px;
      line-height: 1.6;
    }

    #lineStatus {
      padding: 12px;
      border-radius: 10px;
      background: #f0f2f4;
      text-align: center;
      font-size: 14px;
      margin-bottom: 20px;
      line-height: 1.6;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
    }

    .required {
      color: #d93025;
    }

    input {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #d5d9dd;
      border-radius: 10px;
      font-size: 16px;
      background: #fff;
    }

    input:focus {
      outline: none;
      border-color: #06c755;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 14px;
      font-size: 17px;
      font-weight: bold;
      background: #06c755;
      color: white;
      cursor: pointer;
      margin-top: 8px;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      display: none;
      margin-top: 20px;
      padding: 14px;
      border-radius: 10px;
      line-height: 1.6;
    }

    .success {
      display: block !important;
      background: #e8f7ed;
      color: #166534;
    }

    .warning {
      display: block !important;
      background: #fff7e6;
      color: #8a5700;
    }

    .error {
      display: block !important;
      background: #fdecec;
      color: #b42318;
    }

    #responseFrame {
      display: none;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>ลงทะเบียนเข้าร่วม OpenChat</h1>

  <div class="subtitle">
    สำหรับผู้ประกอบการสถานพยาบาล<br>
    จังหวัดสุพรรณบุรี
  </div>

  <div id="lineStatus">
    กำลังเชื่อมต่อบัญชี LINE...
  </div>

  <form
    id="registerForm"
    method="POST"
    target="responseFrame">

    <input
      type="hidden"
      id="lineUserId"
      name="lineUserId">

    <input
      type="hidden"
      id="lineDisplayName"
      name="lineDisplayName">

    <input
      type="hidden"
      id="idToken"
      name="idToken">


    <div class="form-group">

      <label>
        ชื่อ-นามสกุล
        <span class="required">*</span>
      </label>

      <input
        type="text"
        id="fullName"
        name="fullName"
        placeholder="กรอกชื่อ-นามสกุล"
        required>

    </div>


    <div class="form-group">

      <label>
        ชื่อสถานพยาบาล
        <span class="required">*</span>
      </label>

      <input
        type="text"
        id="facilityName"
        name="facilityName"
        placeholder="กรอกชื่อสถานพยาบาล"
        required>

    </div>


    <div class="form-group">

      <label>
        ตำแหน่ง / หน้าที่
        <span class="required">*</span>
      </label>

      <input
        type="text"
        id="position"
        name="position"
        placeholder="เช่น ผู้รับอนุญาต ผู้ดำเนินการ เจ้าหน้าที่"
        required>

    </div>


    <button
      type="submit"
      id="submitButton"
      disabled>
      กำลังเชื่อมต่อ LINE...
    </button>

  </form>


  <div id="message"></div>

</div>


<iframe
  id="responseFrame"
  name="responseFrame">
</iframe>


<script>

  const LIFF_ID =
    '2011774617-WRY44KK3';

  const API_URL =
    'https://script.google.com/macros/s/AKfycbzsEBT5BGtx1do4JVTkRo0cxdVuFTr-nvxV9-Az45kz5oe8RQBjmr3fVMzfk34znejg/exec';


  let lineUserId = '';
  let lineDisplayName = '';
  let lineIdToken = '';


  async function initializeLiff() {

    const status =
      document.getElementById('lineStatus');

    const button =
      document.getElementById('submitButton');


    try {

      await liff.init({
        liffId: LIFF_ID
      });


      if (!liff.isLoggedIn()) {

        liff.login();
        return;
      }


      const profile =
        await liff.getProfile();


      lineUserId =
        profile.userId;

      lineDisplayName =
        profile.displayName;

      lineIdToken =
        liff.getIDToken();


      if (!lineIdToken) {

        throw new Error(
          'ไม่สามารถรับ LINE ID Token ได้'
        );
      }


      document
        .getElementById('lineUserId')
        .value = lineUserId;

      document
        .getElementById('lineDisplayName')
        .value = lineDisplayName;

      document
        .getElementById('idToken')
        .value = lineIdToken;


      status.textContent =
        'เชื่อมต่อ LINE แล้ว : ' +
        lineDisplayName;

      status.style.background =
        '#e8f7ed';

      status.style.color =
        '#166534';


      button.disabled = false;
      button.textContent = 'ลงทะเบียน';


    } catch (error) {

      console.error(error);

      status.textContent =
        'ไม่สามารถเชื่อมต่อบัญชี LINE ได้';

      status.style.background =
        '#fdecec';

      status.style.color =
        '#b42318';

      button.disabled = true;

      button.textContent =
        'ไม่สามารถลงทะเบียนได้';
    }
  }


  /*
   * ก่อนส่ง Form
   */
  document
    .getElementById('registerForm')
    .addEventListener(
      'submit',
      function(event) {

        const button =
          document.getElementById(
            'submitButton'
          );

        const message =
          document.getElementById(
            'message'
          );


        if (
          !lineUserId ||
          !lineIdToken
        ) {

          event.preventDefault();

          message.textContent =
            'ไม่พบข้อมูลบัญชี LINE กรุณาเปิดแบบฟอร์มผ่าน LINE';

          message.className =
            'error';

          return;
        }


        /*
         * ส่ง POST ไป Apps Script
         * ผ่าน hidden iframe
         */
        this.action = API_URL;


        button.disabled = true;

        button.textContent =
          'กำลังตรวจสอบ...';


        message.style.display =
          'none';

        message.className = '';
      }
    );


  /*
   * รับผลจาก Apps Script
   */
  window.addEventListener(
    'message',
    function(event) {

      /*
       * Apps Script HTML อาจทำงานผ่าน
       * googleusercontent.com
       */
      const validOrigin =
  event.origin ===
    'https://script.google.com' ||
  event.origin.endsWith(
    '.googleusercontent.com'
  );


if (!validOrigin) {
  return;
}


      const data =
        event.data;


      if (
        !data ||
        data.source !==
          'hospital-registration' ||
        !data.result
      ) {
        return;
      }


      const result =
        data.result;


      const message =
        document.getElementById(
          'message'
        );

      const button =
        document.getElementById(
          'submitButton'
        );


      message.textContent =
        result.message ||
        'ดำเนินการเรียบร้อยแล้ว';


      /*
       * ลงทะเบียน/ยื่นใหม่สำเร็จ
       */
      if (result.success) {

        message.className =
          'success';

        document
          .getElementById(
            'registerForm'
          )
          .reset();


        button.disabled = true;

        button.textContent =
          'ส่งข้อมูลแล้ว';

        return;
      }


      /*
       * อยู่ระหว่างตรวจสอบ
       */
      if (result.status === 'pending') {

        message.className =
          'warning';

        button.disabled = false;

        button.textContent =
          'ลงทะเบียน';

        return;
      }


      /*
       * ได้รับการอนุมัติแล้ว
       */
      if (result.status === 'approved') {

        message.className =
          'success';

        button.disabled = true;

        button.textContent =
          'ได้รับการอนุมัติแล้ว';

        return;
      }


      /*
       * Error อื่น ๆ
       */
      message.className =
        'error';

      button.disabled = false;

      button.textContent =
        'ลงทะเบียน';
    }
  );


  initializeLiff();

</script>

</body>
</html>
